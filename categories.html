<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>All Categories</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <h1 class="logo">EventFinder</h1>
    <nav>
      <button id="theme-toggle">🌙 Dark Mode</button>
      <a href="index.html">Home</a>
      <a href="signup.html">Sign Up</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <h2>Discover Events Near You</h2>
    <p>Find concerts, tech meetups, church events and more</p>
    
    <div class="search-box">
      <input type="text" placeholder="Search events...">
      <button>Search</button>
    </div>
  </section>
    <!-- Categories Section -->
    <section class="categories-container">
      <div class="categories-header">
        <h2>All Categories</h2>
      </div>

      <div class="categories-grid">
        <div class="category" data-category="music">🎵 Music</div>
        <div class="category" data-category="religion">⛪️ Religion</div>
        <div class="category" data-category="business">💼 Business</div>
        <div class="category" data-category="concert">🎸 Concert</div>
        <div class="category" data-category="theatre">🎭 Theatre</div>
        <div class="category" data-category="finearts">🎨 Fine Arts</div>
        <div class="category" data-category="tech">💻 Technology</div>
        <div class="category" data-category="sports">⚽️ Sports</div>
        <div class="category" data-category="health">❤️ Health & Wellness</div>
        <div class="category" data-category="gaming">🎮 Gaming</div>
      </div>
    </section>

  <!-- Footer -->
  <footer>
    <p>© 2026 EventFinder. All rights reserved.</p>
  </footer>
<script src="scripts/theme.js"></script>
<script>
document.querySelectorAll(".category").forEach(btn => {
  btn.addEventListener("click", () => {
        const cat = btn.dataset.category;
    window.location.href = `index.html?category=${cat}`;
  });
});
</script>
</body>
</html>
