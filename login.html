<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - EventFinder</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/home-auth.css" />
  <link rel="stylesheet" href="styles/responsiveness.css" />
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <h1 class="logo">EventFinder</h1>
    <nav>
      <button id="theme-toggle">🌙 Dark Mode</button>
      <a href="index.html">Home</a>
      <a href="signup.html">Sign Up</a>
    </nav>
  </header>

  <!-- Login Form -->
  <section class="auth-section">
    <div class="auth-box">
      <h2>Welcome Back</h2>
      <p class="auth-sub">Login to your EventFinder account</p>

      <div class="auth-form">

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="login-email" placeholder="Enter your email" />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="Enter your password" />
        </div>

        <p id="login-error" class="auth-error"></p>
        <p id="login-success" class="auth-success"></p>

        <button class="auth-btn" onclick="handleLogin()">Login</button>

        <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up here</a></p>

      </div>
    </div>
  </section>

  <footer>
    <p>© 2026 EventFinder. All rights reserved.</p>
  </footer>

  <script src="scripts/theme.js"></script>
  <script>
        function handleLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value.trim();
  const error = document.getElementById('login-error');
  const success = document.getElementById('login-success');

  error.textContent = '';
  success.textContent = '';

  // Check for empty fields
  if (!email || !password) {
    error.textContent = '⚠️ Please fill in all fields.';
    return;
  }

  // Email format validation
  const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailPattern.test(email)) {
    error.textContent = '⚠️ Please enter a valid email address (e.g., name@example.com).';
    return;
  }

  // Check if user exists
  const saved = localStorage.getItem('eventfinder_user');

  if (!saved) {
    error.textContent = '⚠️ No account found. Please sign up first.';
    return;
  }

  const user = JSON.parse(saved);

  // Check credentials
  if (user.email !== email) {
    error.textContent = '⚠️ Email not found. Please sign up first.';
    return;
  }

  if (user.password !== password) {
    error.textContent = '⚠️ Incorrect password. Please try again.';
    return;
  }

  success.textContent = '✅ Login successful! Redirecting...';
  localStorage.setItem('eventfinder_loggedin', 'true');
  localStorage.setItem('eventfinder_username', user.name);

  // Check if user was trying to add an event
  const redirectAfterLogin = localStorage.getItem('redirectAfterLogin');
  
  setTimeout(() => {
    if (redirectAfterLogin === 'true') {
      localStorage.removeItem('redirectAfterLogin');
      window.location.href = 'index.html?action=addEvent';
    } else {
      window.location.href = 'index.html';
    }
  }, 1500);
}

    // Real-time email validation (shows as user types)
function validateEmailRealtime(input) {
  const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const errorSpan = document.getElementById('email-error');
  
  if (input.value.length > 0 && !emailPattern.test(input.value)) {
    if (!errorSpan) {
      const span = document.createElement('span');
      span.id = 'email-error';
      span.style.cssText = 'color: #e74c3c; font-size: 12px; margin-top: 5px; display: block;';
      span.textContent = '⚠️ Enter a valid email (e.g., name@example.com)';
      input.parentElement.appendChild(span);
    }
  } else {
    const existingError = document.getElementById('email-error');
    if (existingError) existingError.remove();
  }
}

// Add event listener to email input (add this after the DOM loads)
document.addEventListener('DOMContentLoaded', function() {
  const emailInput = document.getElementById('signup-email');
  if (emailInput) {
    emailInput.addEventListener('input', function() {
      validateEmailRealtime(this);
    });
  }
});
  </script>

</body>
</html>
