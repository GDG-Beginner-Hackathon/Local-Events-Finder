<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - EventFinder</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/home-auth.css" />
  <link rel="stylesheet" href="styles/responsiveness.css" />
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <h1 class="logo">EventFinder</h1>
    <nav>
      <button id="theme-toggle">🌙 Dark Mode</button>
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <!-- Sign Up Form -->
  <section class="auth-section">
    <div class="auth-box">
      <h2>Create an Account</h2>
      <p class="auth-sub">Join EventFinder and never miss an event</p>

      <div class="auth-form">

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="signup-name" placeholder="Enter your full name" />
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="signup-email" placeholder="Enter your email" />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signup-password" placeholder="Create a password" />
        </div>

        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="signup-confirm" placeholder="Confirm your password" />
        </div>

        <p id="signup-error" class="auth-error"></p>
        <p id="signup-success" class="auth-success"></p>

        <button class="auth-btn" onclick="handleSignup()">Create Account</button>

        <p class="auth-switch">Already have an account? <a href="login.html">Login here</a></p>

      </div>
    </div>
  </section>

  <footer>
    <p>© 2026 EventFinder. All rights reserved.</p>
  </footer>

  <script src="scripts/theme.js"></script>
  <script>
     function handleSignup() {
  const name = document.getElementById('signup-name').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const password = document.getElementById('signup-password').value.trim();
  const confirm = document.getElementById('signup-confirm').value.trim();
  const error = document.getElementById('signup-error');
  const success = document.getElementById('signup-success');

  error.textContent = '';
  success.textContent = '';

  // Check for empty fields
  if (!name || !email || !password || !confirm) {
    error.textContent = '⚠️ Please fill in all fields.';
    return;
  }

  // Email format validation
  const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailPattern.test(email)) {
    error.textContent = '⚠️ Please enter a valid email address (e.g., name@example.com).';
    return;
  }

  // Password match validation
  if (password !== confirm) {
    error.textContent = '⚠️ Passwords do not match.';
    return;
  }

  // Password length validation
  if (password.length < 6) {
    error.textContent = '⚠️ Password must be at least 6 characters.';
    return;
  }

  // Check if email already exists
  const existingUser = localStorage.getItem('eventfinder_user');
  if (existingUser) {
    const user = JSON.parse(existingUser);
    if (user.email === email) {
      error.textContent = '⚠️ Email already registered. Please login instead.';
      return;
    }
  }

  // Save user to localStorage
  const user = { name, email, password };
  localStorage.setItem('eventfinder_user', JSON.stringify(user));

  success.textContent = '✅ Account created! Redirecting to login...';

  setTimeout(() => {
    window.location.href = 'login.html';
  }, 2000);
}

    // Real-time email validation (shows as user types)
function validateEmailRealtime(input) {
  const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const errorSpan = document.getElementById('email-error');
  
  if (input.value.length > 0 && !emailPattern.test(input.value)) {
    if (!errorSpan) {
      const span = document.createElement('span');
      span.id = 'email-error';
      span.style.cssText = 'color: #e74c3c; font-size: 12px; margin-top: 5px; display: block;';
      span.textContent = '⚠️ Enter a valid email (e.g., name@example.com)';
      input.parentElement.appendChild(span);
    }
  } else {
    const existingError = document.getElementById('email-error');
    if (existingError) existingError.remove();
  }
}

// Add event listener to email input (add this after the DOM loads)
document.addEventListener('DOMContentLoaded', function() {
  const emailInput = document.getElementById('signup-email');
  if (emailInput) {
    emailInput.addEventListener('input', function() {
      validateEmailRealtime(this);
    });
  }
});
  </script>

</body>
</html>
